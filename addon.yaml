# Read aloud: every Claude Code reply on the workstation (Souko) is read aloud with Kokoro, a local
# voice model that runs on the CPU, in full. A reply that arrives while another is being read waits
# its turn; Repeat replays the whole last run; "From: <thread>." is said when the voice moves to another
# thread. The name is one typed with N in the reader or on this page, else the "Thread: <title>" line
# the project's assistant puts in its notes, else the session title or the first message. A reader window opens
# by itself next to the Claude app while reading: the thread in a band of its own colour (Super+Alt+O or
# a click opens it on claude.ai), what was asked, the sentence being
# spoken highlighted, and an opacity slider; it closes when reading finishes and remembers where it
# was dragged. Keys are Hyprland (Omarchy) binds, refused if already used; without Hyprland (Ubuntu
# desktop) replies are still read aloud, with no keys or reader window. The Souko installer turns it
# on (HISHO_READ_ALOUD=no skips); the venv and the voice model (sha256-checked) are downloaded on install.
# Undo: `hisho addon remove read-aloud` (keeps the venv and model in ~/.local/share/hisho/read-aloud).
name: read-aloud
title: Read aloud
description: Claude's replies read aloud on your workstation, with a reader window that follows along.
version: 0.9.3
you_need:
  - "Nothing beyond Hisho on the workstation: Claude Code, PipeWire and about 600 MB of disk for the local voice"
  - "Optional: Hyprland (Omarchy) for the keys and the reader window"
host: workstation                  # Fleet.yaml's workstation (Souko), never the Core machine or a Hashira

options:
  voice: af_heart                  # Kokoro voice: af_heart, af_bella, am_michael, am_adam, bf_emma ...
  speed: 100                       # % of normal speed
  opacity: 90                      # reader window, % (the window's slider changes it too)
  auto_open: true                  # open the reader window when reading starts
  announce_thread: true            # say "From: <thread>." when the voice moves to another thread
  auto_pause: true                 # opening the thread pauses reading; the pause key resumes
  title_size: 2                    # thread name in the reader, times normal (1-4; needs kitty, else 1)
  fallback_output: ""              # PipeWire node.name to read on when the default output is broken; "" picks one (a headset before HDMI)
  key_read: SUPER + ALT + T        # read the highlighted text (or clipboard); stops reading if it is
  key_repeat: SUPER + ALT + R
  key_stop: SUPER + ALT + X
  key_mute: SUPER + ALT + M
  key_reader: SUPER + ALT + V      # open/close the reader window
  key_open: SUPER + ALT + O        # open the thread being read on claude.ai
  key_pause: SUPER + ALT + P       # pause / resume (resumes from the start of the paused sentence)
  key_rename: SUPER + ALT + N      # rename the thread: the reader comes forward with the name to edit
  key_skip: SUPER + ALT + J        # skip to the next reply waiting (the skipped one stays for Repeat)
  kokoro_onnx: 0.4.7
schema:
  voice: str
  speed: int
  opacity: int
  auto_open: bool
  announce_thread: bool
  auto_pause: bool
  title_size: int
  fallback_output: str?
  key_read: str                    # "none" leaves a key out
  key_repeat: str
  key_stop: str
  key_mute: str
  key_reader: str
  key_open: str
  key_pause: str
  key_rename: str
  key_skip: str
  kokoro_onnx: str
requires:
  commands: [python3, pw-cat, curl, sha256sum]

services: []
checks: []

actions:
  repeat:
    label: Repeat last run
    run: bin/say-it --repeat
    confirm: false
  stop:
    label: Stop reading
    run: bin/say-it --stop
    confirm: false
  mute:
    label: Mute / unmute
    run: bin/say-it --mute
    confirm: false
  skip:
    label: Skip to the next reply
    run: bin/say-it --skip dashboard
    confirm: false
  pause:
    label: Pause / resume
    run: bin/say-it --pause dashboard
    confirm: false
  name-thread:
    label: Name the thread being read
    params: [name]
    text: [name]                   # as on your Threads tab; wins over everything else
    run: bin/say-it --name-thread {name}
    confirm: false
  open-thread:
    label: Open thread being read
    run: bin/say-it --open-thread dashboard
    confirm: false
  test:
    label: Test voice
    run: bin/say-it --test
    confirm: false
  opacity:
    label: Reader opacity (%)
    params: [percent]
    run: bin/say-it --opacity {percent}
    confirm: false
  status:
    label: Status
    run: bin/say-it --status
    confirm: false

links: []
install: bin/install.sh
uninstall: bin/uninstall.sh

# Plain words for each setting (shown on the dashboard).
help:
  voice:
    label: Voice
    say: "Which voice reads, like af_heart, af_bella, am_michael, am_adam or bf_emma. Try one with Test voice."
  speed:
    label: Speed (%)
    say: "How fast it reads: 100 is normal, 120 is faster, 80 is slower."
  opacity:
    label: Reader window see-through (%)
    say: "How solid the reader window is: 100 is solid, lower lets you see through it. The slider in the window changes it too."
  auto_open:
    label: Open the reader window by itself
    say: "On: the reader window opens when reading starts and closes when it ends. Off: open it with its key."
  announce_thread:
    label: Say which thread is read
    say: "On: it says \"From:\" and the thread's name when it moves to a reply from another thread."
  auto_pause:
    label: Pause when you open the thread
    say: "On: opening the thread being read pauses reading. The pause key carries on."
  title_size:
    label: Thread name size
    say: "How big the thread's name is in the reader window, from 1 (normal) to 4. Needs the kitty terminal; without it, 1."
  fallback_output:
    label: Backup speaker (optional)
    say: "Where to play when the usual speaker is broken: a PipeWire output name. Leave empty and it picks one itself (a headset before a TV)."
  key_read:
    label: Key to read the selected text
    say: "A keyboard shortcut, like SUPER + ALT + T: reads the highlighted text (or what you copied); pressed while reading, it stops. Type none to have no key. A key already used elsewhere is refused."
  key_repeat:
    label: Key to repeat
    say: "A keyboard shortcut, like SUPER + ALT + R: reads the last replies again. Type none to have no key."
  key_stop:
    label: Key to stop
    say: "A keyboard shortcut, like SUPER + ALT + X: stops reading. Type none to have no key."
  key_mute:
    label: Key to mute
    say: "A keyboard shortcut, like SUPER + ALT + M: mutes or unmutes reading. Type none to have no key."
  key_reader:
    label: Key for the reader window
    say: "A keyboard shortcut, like SUPER + ALT + V: opens or closes the reader window. Type none to have no key."
  key_open:
    label: Key to open the thread
    say: "A keyboard shortcut, like SUPER + ALT + O: opens the thread being read on claude.ai. Type none to have no key."
  key_pause:
    label: Key to pause
    say: "A keyboard shortcut, like SUPER + ALT + P: pauses, and pressed again carries on from the start of that sentence. Type none to have no key."
  key_rename:
    label: Key to rename the thread
    say: "A keyboard shortcut, like SUPER + ALT + N: brings the reader forward so you can type a name for the thread. Type none to have no key."
  key_skip:
    label: Key to skip
    say: "A keyboard shortcut, like SUPER + ALT + J: skips to the next waiting reply (the skipped one can still be repeated). Type none to have no key."
  kokoro_onnx:
    label: Voice engine version
    say: "Which release of Kokoro, the voice program, is installed. Leave it as it is: changing it installs that release on the next install."
